name: Build

# Every push: compile + test, and keep a downloadable Ebb.zip as a workflow artifact.
# Push a tag like v0.1.0: also publish a GitHub Release with Ebb.zip attached.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: swift test

      - name: Build universal app
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == tag ]] || VERSION=""
          UNIVERSAL=1 VERSION="$VERSION" scripts/build-app.sh
          ditto -c -k --keepParent build/Ebb.app build/Ebb.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Ebb
          path: build/Ebb.zip

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/Ebb.zip \
            --title "Ebb $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md
