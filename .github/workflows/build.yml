name: Build

# Every push: unit-test on macOS, Windows and Linux, build the real app for each, run it
# through a sped-up work → break → work cycle, and keep the installers as workflow artifacts.
# To release: push a tag like v0.3.0, or run this workflow from the Actions tab with a version
# number. Either way a GitHub Release is published with installers for every platform and the
# signed latest.json that installed copies of Ebb update themselves from.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. 0.3.0 (leave empty to just build)
        required: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Set when releasing: the tag pushed, or v + the version typed in the Actions tab.
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || (inputs.version != '' && format('v{0}', inputs.version) || '') }}

jobs:
  create-release:
    if: github.ref_type == 'tag' || inputs.version != ''
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" --draft --target "$GITHUB_SHA" --title "Ebb $RELEASE_TAG" --notes-file .github/release-notes.md
          echo "id=$(gh release view "$RELEASE_TAG" --json databaseId -q .databaseId)" >> "$GITHUB_OUTPUT"

  build:
    needs: [create-release]
    if: always() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
            args: --target universal-apple-darwin
            binary: src-tauri/target/universal-apple-darwin/release/ebb
          - os: windows-latest
            name: Windows
            args: ''
            binary: src-tauri/target/release/ebb.exe
          - os: ubuntu-22.04
            name: Linux
            args: ''
            binary: src-tauri/target/release/ebb
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb dbus-x11

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Use the release version
        if: env.RELEASE_TAG != ''
        shell: bash
        run: node -e "const f='src-tauri/tauri.conf.json',c=require('./'+f);c.version=process.env.RELEASE_TAG.replace(/^v/,'');require('fs').writeFileSync(f,JSON.stringify(c,null,2))"

      - name: Build (and upload to the release on tags)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.id }}
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      - name: Smoke test the real app
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a dbus-launch --exit-with-session scripts/smoke-test.sh "${{ matrix.binary }}"
          else
            scripts/smoke-test.sh "${{ matrix.binary }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Ebb-${{ matrix.name }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm
            src-tauri/target/**/release/bundle/appimage/*.AppImage
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-${{ matrix.name }}
          path: build/smoke

  publish-release:
    needs: [create-release, build]
    if: github.ref_type == 'tag' || inputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
