name: Build

# Every push: compile, unit-test, run the real app through a full cycle, and keep a downloadable Ebb.zip as a workflow artifact.
# To release: push a tag like v0.1.0, or run this workflow from the Actions tab with a
# version number. Either way a GitHub Release with Ebb.zip attached is published.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. 0.1.0 (leave empty to just build)
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: swift test

      - name: Build universal app
        run: |
          VERSION="${{ inputs.version }}"
          [[ "$GITHUB_REF_TYPE" == tag ]] && VERSION="${GITHUB_REF_NAME#v}"
          UNIVERSAL=1 VERSION="$VERSION" scripts/build-app.sh
          ditto -c -k --keepParent build/Ebb.app build/Ebb.zip

      - name: Smoke test the real app
        run: scripts/smoke-test.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Ebb
          path: build/Ebb.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test
          path: build/smoke

      - name: Publish release
        if: github.ref_type == 'tag' || inputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          [[ "$GITHUB_REF_TYPE" == tag ]] || TAG="v${{ inputs.version }}"
          gh release create "$TAG" build/Ebb.zip \
            --target "$GITHUB_SHA" \
            --title "Ebb $TAG" \
            --notes-file .github/release-notes.md
